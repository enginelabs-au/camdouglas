name: Backup reviews

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published reviews
        run: |
          mkdir -p backups
          curl -fsS "https://camdouglas.com/api/reviews" -o backups/reviews.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("backups/reviews.json")
          path.write_text(json.dumps(json.loads(path.read_text()), indent=2) + "\n")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/reviews.json
          if git diff --staged --quiet; then
            echo "No review changes."
            exit 0
          fi
          git commit -m "Backup published reviews."
          git push
